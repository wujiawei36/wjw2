{% extends 'index/base.html' %}

{% block head %}
<title>设置 - {{ site_name }}</title>
{% endblock %}

{% block content %}
	<h1 class="h1-text">设置</h1>

	<h2 class="h2-text">账号与安全</h2>
	{% if is_demo %}
	<p class="p-text">演示账号不支持账户安全设置。</p>
	{% else %}
	<ul>
		<li class="li-text">
			<a class="a-text" href="{% url 'users:change_password' %}">修改密码</a>
		</li>
		<li class="li-text">
			<a class="a-text" href="{% url 'users:two_factor_setup' %}">两步验证</a>
		</li>
		<li class="li-text">
			<a class="a-text" href="{% url 'users:sessions' %}">会话管理</a>
		</li>
		<li class="li-text">
			<a class="a-text" href="{% url 'users:login_history' %}">登录历史</a>
		</li>
	</ul>
	{% endif %}
{% endblock %}
