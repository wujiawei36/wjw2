{% extends 'index/base.html' %}

{% block head %}
<title>注册 - {{ site_name }}</title>
{% endblock %}

{% block content %}
    <h1 class="h1-text" data-page-node-id="gRJxPXPr3l3B67R9uJ9BDn">
        注册
    </h1>
    <form action="" method="post" onsubmit="return validateForm()" name="register_form" data-page-node-id="B3w5aCbOQcIvo2D0nsE5k8">
        {% csrf_token %}
        <input type="hidden" name="required" data-page-node-id="u9Rx2GnU0eiPhBza3yrjFD">
        用户名:
        <input type="text" name="username" required data-page-node-id="P1hJbEH96FEQ1BdxJLizCy">
        <br data-page-node-id="3gFv6YbdM8E8Hc6vCaaldP">
        邮箱(可选):
        <input type="email" name="email" data-page-node-id="VzmE6klo80UnTjpfirfPEf">
        <br data-page-node-id="xmzovOjzBGe5UvG7nSAMM8">
        密码:
        <input type="password" name="password" required data-page-node-id="a05hkzPrRViyh1LnZa2ZjT">
        <br data-page-node-id="VXjegYzxK9VHYv2N7NRc3b">
        再次输入密码: 
        <input type="password" name="password_check" required data-page-node-id="uAzguXiYbRq8gRSpqo664g">

        <br data-page-node-id="DbSBlH1dNmen7p59DIyUhH">
        邀请码:
        <input type="text" name="invite_code" required autocomplete="off" data-page-node-id="k60YxZeBTJSBnJMCLzzWNn">
        <br data-page-node-id="MHbUBVmRFMRyzg7p1dirOL">
        图形验证码:
        <input type="text" id="captcha" name="captcha" required data-page-node-id="7yEZ37nyAFELvX7x6tyHD1">
        <img src="{{ captcha_image_url }}" alt="验证码" data-page-node-id="e7oyYdSiaRx9ebnfEb3kaN">
        <br data-page-node-id="3fZoAJz92MJuBRmPKiQueb">
        <input type="hidden" id="captcha_key" name="captcha_key" value="{{ captcha_key }}" autocomplete="off" data-page-node-id="RBHJXqgU5EFF7obCveGgcY">
        <input type="submit" value="注册" data-page-node-id="TMSeMM8qKhsBqNjcC4Nyfk">
    </form>
    <p class="p-text" data-page-node-id="IGCT9IsKld0lmB5OeAfW4d">已有账号？<a class="a-text" href="{% url 'users:login' %}" data-page-node-id="WYo55IhP4HSVb65UO7mkiQ">直接登录</a></p>
    <script>
        function validateForm()
        {
            var required=document.forms['register_form']['required'].value;
            if(required&&required!='')
                return false;
            var password=document.forms['register_form']['password'].value;
            var password_check=document.forms['register_form']['password_check'].value;
            if(password!=password_check)
            {
                alert('密码不匹配');
                return false;
            }
            return true;
        }
    </script>
    {% if errors %}
        <p class="p-text" data-page-node-id="wROa6z84iVGXgR7DAT921U">
            错误:{{ errors }}
        </p>
    {% endif %}
{% endblock %}
