{% extends 'index/base.html' %}

{% block head %}
<title>登录 - {{ site_name }}</title>
{% endblock %}

{% block content %}
    <h1 class="h1-text">
        登录
    </h1>
    <form action="" method="post" name="login_form" onsubmit="return validateForm()">
        {% csrf_token %}
        <input type="hidden" name="required">
        用户名或用户编号:
        <input type="text" name="username" required>
        <br>
        密码:
        <input type="password" name="password" required>

        <br>
        <button type="button" id="fill-demo">一键填充演示账号</button>
        <br>
        图形验证码:
        <input type="text" id="captcha" name="captcha" required>
        <img src="{{ captcha_image_url }}" alt="验证码">
        <br>
        <input type="hidden" id="captcha_key" name="captcha_key" value="{{ captcha_key }}" autocomplete="off">

        <input type="submit" value="登录">
    </form>
    <p class="p-text">没有账号？<a class="a-text" href="{% url 'users:register' %}">立即注册</a></p>
    <script>
        function validateForm()
        {
            var required=document.forms['login_form']['required'].value;
            if(required&&required!='')
                return false;
            return true;
        }
        // 一键填充演示账号：只填用户名/密码，验证码仍需手动输入
        (function () {
            var btn = document.getElementById('fill-demo');
            if (btn) {
                btn.addEventListener('click', function () {
                    document.forms['login_form']['username'].value = '{{ demo_username|escapejs }}';
                    document.forms['login_form']['password'].value = '{{ demo_password|escapejs }}';
                });
            }
        })();
    </script>
    {% if errors %}
        <p class="p-text">
            错误:{{ errors }}
        </p>
    {% endif %}
{% endblock %}
